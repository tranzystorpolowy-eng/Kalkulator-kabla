name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Visit Streamlit App and wake up if sleeping
        run: |
          node -e '
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext();
            const page = await context.newPage();
            const url = "https://kalkulator-kabla-mx3zgutjr2jjz9bm9kqsnr.streamlit.app/";

            console.log("Opening:", url);
            await page.goto(url, { waitUntil: "domcontentloaded", timeout: 60000 });
            await page.waitForTimeout(8000);

            const wakeBtn = page.locator("button:has-text(\"Yes, get this app back up\")");
            if (await wakeBtn.count() > 0) {
              console.log("App is sleeping. Clicking wake-up button...");
              await wakeBtn.first().click();
              await page.waitForTimeout(20000);
            } else {
              console.log("App is already awake.");
            }

            await page.waitForTimeout(5000);
            await browser.close();
            console.log("Done.");
          })();
          '
